body.ne{font-family:'Noto Sans Devanagari',Archivo,sans-serif}body.ne .sf{font-family:'Noto Serif Devanagari',serif!important;letter-spacing:0!important}
.sf{font-family:'Cormorant Garamond',Georgia,serif}.eb{font-size:10px;letter-spacing:.3em;text-transform:uppercase}body.ne .eb{letter-spacing:.06em;font-size:12px;text-transform:none}
